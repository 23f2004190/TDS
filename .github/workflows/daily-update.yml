name: Daily Update by 23f2004190@ds.study.iitm.ac.in

on:
  schedule:
    - cron: '30 15 * * *'  # Runs daily at 15:30 UTC (8:00 PM IST roughly)
  workflow_dispatch:  # Lets you trigger manually for testing

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Update timestamp file by 23f2004190@ds.study.iitm.ac.in
        run: |
          echo "Last updated: $(date -u)" > STATUS.md

      - name: Commit changes
        run: |
          git config user.name "Daily Bot"
          git config user.email "23f2004190@ds.study.iitm.ac.in"
          git add STATUS.md
          git commit -m "Daily update: $(date -u) [skip ci]" || echo "No changes"
          git push